stages: [verify]
linux:
  stage: verify
  image: docker:29-cli
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - apk add --no-cache bash
    - docker info
    - docker compose version
  script:
    - bash docker/run-ci.sh
  artifacts:
    when: always
    paths: [artifacts/]
    expire_in: 14 days
