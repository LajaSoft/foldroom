name: Publish Godot web demo and gameplay
on:
  push:
    branches: [main]
    paths:
      - godot/**
      - docker/web/**
      - compose.web.yml
      - docs/gameplay.html
      - docs/media/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Build current Godot game without native extensions
        run: |
          mkdir -p artifacts/pages
          LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)" docker compose -f compose.web.yml run --build --rm web-export
      - name: Prepare player and media
        run: |
          mkdir -p artifacts/pages/media
          cp docs/gameplay.html artifacts/pages/index.html
          cp docs/media/rolling-balls.jpg artifacts/pages/media/
          cp docs/media/tube_demo.jpg artifacts/pages/media/
          cp docs/media/current_10_22.jpg artifacts/pages/media/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages
      - uses: actions/deploy-pages@v4
        id: deployment
