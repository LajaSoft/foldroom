name: Publish gameplay player
on:
  push:
    branches: [main]
    paths:
      - docs/gameplay.html
      - docs/media/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare player and media
        run: |
          mkdir -p public/media
          cp docs/gameplay.html public/index.html
          cp docs/media/rolling-balls.jpg public/media/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
