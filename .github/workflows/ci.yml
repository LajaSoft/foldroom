name: Build and verify FoldRoom
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Test release publication
        run: python3 -m unittest discover -s tests -p test_publish_release.py -v
      - name: Test, export and package Linux AppImage
        run: bash docker/run-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FoldRoom-linux-x86_64
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FoldRoom-AppImage-x86_64
          path: |
            artifacts/FoldRoom-x86_64.AppImage
            artifacts/SHA256SUMS
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Export and verify Windows x64 with FFB
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FoldRoom-windows-x86_64
          path: |
            artifacts/FoldRoom-windows-x86_64.zip
            artifacts/FoldRoom-windows-SHA256SUMS
            artifacts/windows-*.log
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: FoldRoom-linux-x86_64
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: FoldRoom-windows-x86_64
          path: release-assets/windows
      - name: Verify packages and publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish_release.py "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
